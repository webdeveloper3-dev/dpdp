<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Privacy Engine — DPDP Act 2023 Enterprise Compliance Platform</title>

  <!-- Tailwind CSS & React 18 & Babel via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#0b0f19',
            surface: '#111827',
            card: '#161f30',
            borderline: '#253349',
            accent: '#38bdf8'
          },
          borderRadius: {
            none: '0px',
            sm: '2px',
            DEFAULT: '4px',
            md: '4px',
            lg: '6px'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Industrial Crisp UI (Less Rounded, High Density) */
    * { border-radius: 2px !important; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #253349; }
    ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
    .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col font-sans antialiased text-xs select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = "http://localhost:5000/api";

    // Crisp Lucide SVG Icon Components (16x16 / 18x18, stroke 1.5)
    const Icons = {
      Shield: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
      Database: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>,
      FileText: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
      Layers: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/></svg>,
      Lock: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
      Key: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><path d="M21 2l-2 2m-1.5 1.5L16 7l-1.5-1.5M19 4l-4 4-2-2 1.5-1.5M10.5 13.5a6 6 0 1 1-8.5-8.5 6 6 0 0 1 8.5 8.5zm0 0l7.5 7.5"/></svg>,
      Clock: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      AlertTriangle: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
      Code: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>,
      Building: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="2"/><line x1="8" y1="6" x2="10" y2="6"/><line x1="14" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/></svg>,
      CheckCircle: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
      Users: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    };

    function App() {
      const [backendStatus, setBackendStatus] = useState("CHECKING");
      const [activeTab, setActiveTab] = useState("ropa-hub"); // ropa-hub, clients, notices, consent, privacy, dsr, crypto, breach, integration
      const [clients, setClients] = useState([
        { tenant_id: "ASCII_GROUP", client_name: "ASCII Online Solutions (Internal Operations)", industry: "IT Services & Cloud Hosting", entity_name: "ASCII Online Solutions Pvt. Ltd.", cin: "U72900MH2020PTC345678", pan: "AAACA1234D", dpo_name: "Gopal Gawas (Chief Compliance Officer)", dpo_email: "compliance@asciionline.com", api_key: "dpdp_live_ascii_master_2026" },
        { tenant_id: "APEX_HEALTHCARE", client_name: "Apex Multi-Speciality Hospitals", industry: "Healthcare & Diagnostics", entity_name: "Apex Healthcare & Research Institute Ltd.", cin: "U85110MH2018PLC301122", pan: "AAACA5678K", dpo_name: "Dr. Sunita Kulkarni", dpo_email: "dpo@apexhospital.org", api_key: "dpdp_live_apex_health_2026" },
        { tenant_id: "BHARAT_RETAIL", client_name: "Bharat Mart Retail & E-Commerce", industry: "Retail & Consumer Goods", entity_name: "Bharat Mart India Ltd.", cin: "U52100MH2019PLC298765", pan: "BBBCB4321E", dpo_name: "Adv. Rahul Verma", dpo_email: "privacy@bharatmart.in", api_key: "dpdp_live_bharat_mart_2026" }
      ]);
      const [selectedTenant, setSelectedTenant] = useState("ASCII_GROUP");
      const [ropaData, setRopaData] = useState(null);
      const [selectedForm, setSelectedForm] = useState("01"); // 01 to 13
      const [showNewClientModal, setShowNewClientModal] = useState(false);

      const fetchStatus = async () => {
        try {
          const res = await fetch(`${API_BASE}/health`);
          if (res.ok) setBackendStatus("ACTIVE");
          else setBackendStatus("OFFLINE");
        } catch (e) {
          setBackendStatus("OFFLINE");
        }
      };

      const fetchClients = async () => {
        try {
          const res = await fetch(`${API_BASE}/dpdp/clients`);
          const json = await res.json();
          if (json.success && json.clients.length > 0) {
            setClients(json.clients);
          }
        } catch (e) {}
      };

      const fetchRopa = async (tId) => {
        try {
          const res = await fetch(`${API_BASE}/dpdp/ropa/overview?tenant_id=${tId}`);
          const json = await res.json();
          if (json.success) setRopaData(json);
        } catch (e) {}
      };

      useEffect(() => {
        fetchStatus();
        fetchClients();
        fetchRopa(selectedTenant);
        const timer = setInterval(fetchStatus, 10000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        fetchRopa(selectedTenant);
      }, [selectedTenant]);

      const currentClient = clients.find(c => c.tenant_id === selectedTenant) || clients[0];

      return (
        <div class="flex flex-col h-screen overflow-hidden">
          {/* TOP BAR - ENTERPRISE HIGH DENSITY */}
          <header class="bg-[#111827] border-b border-[#253349] px-4 py-2 flex items-center justify-between flex-shrink-0 z-20">
            <div class="flex items-center space-x-3">
              <div class="w-6 h-6 bg-sky-500 flex items-center justify-center font-bold text-slate-950 text-xs">
                A
              </div>
              <div>
                <div class="flex items-center space-x-2">
                  <span class="font-bold text-slate-100 text-xs tracking-tight uppercase">ASCII Privacy Engine</span>
                  <span class="text-[10px] px-1.5 py-0.2 rounded-none bg-sky-500/10 text-sky-400 border border-sky-500/30 font-mono">DPDP-2023-V2.1</span>
                  <span class="text-[10px] text-slate-500">|</span>
                  <span class="text-[10px] text-slate-400">Statutory Master Architecture for Client Applications</span>
                </div>
              </div>
            </div>

            {/* TENANT SWITCHER & SYSTEM STATUS */}
            <div class="flex items-center space-x-3">
              <div class="flex items-center space-x-2 bg-[#0b0f19] px-2.5 py-1 border border-[#253349]">
                <span class="text-[10px] text-slate-400 uppercase font-semibold">Active Client:</span>
                <select 
                  value={selectedTenant}
                  onChange={(e) => {
                    if (e.target.value === "ADD") setShowNewClientModal(true);
                    else setSelectedTenant(e.target.value);
                  }}
                  class="bg-transparent text-xs text-sky-400 font-semibold outline-none cursor-pointer"
                >
                  {clients.map(c => (
                    <option key={c.tenant_id} value={c.tenant_id} class="bg-[#111827] text-slate-200">
                      {c.client_name} ({c.industry})
                    </option>
                  ))}
                  <option value="ADD" class="bg-[#111827] text-amber-400 font-bold">+ Register New Enterprise Client</option>
                </select>
              </div>

              <div class="flex items-center space-x-1.5 px-2.5 py-1 bg-[#0b0f19] border border-[#253349]">
                <span class={`w-2 h-2 ${backendStatus === 'ACTIVE' ? 'bg-emerald-400' : 'bg-rose-500'}`}></span>
                <span class="text-[10px] font-mono text-slate-300">Engine :5000 {backendStatus}</span>
              </div>
            </div>
          </header>

          {/* SECONDARY CLIENT SUMMARY STRIP */}
          <div class="bg-[#161f30] border-b border-[#253349] px-4 py-1.5 flex items-center justify-between text-[11px] text-slate-400">
            <div class="flex items-center space-x-4">
              <span>Entity: <strong class="text-slate-200">{currentClient.entity_name}</strong></span>
              <span>CIN: <strong class="text-slate-300 mono-font">{currentClient.cin}</strong></span>
              <span>DPO: <strong class="text-slate-200">{currentClient.dpo_name}</strong> ({currentClient.dpo_email})</span>
            </div>
            <div class="flex items-center space-x-3">
              <span>API Key: <span class="mono-font text-sky-400">{currentClient.api_key.slice(0, 16)}...</span></span>
              <span class="text-emerald-400 font-semibold bg-emerald-500/10 px-1.5 border border-emerald-500/30">MAX ₹250 CR SHIELD ACTIVE</span>
            </div>
          </div>

          {/* WORKSPACE LAYOUT */}
          <div class="flex flex-1 overflow-hidden">
            {/* SIDEBAR NAVIGATION - COMPACT INDUSTRIAL */}
            <aside class="w-56 bg-[#111827] border-r border-[#253349] flex flex-col flex-shrink-0 overflow-y-auto">
              <div class="p-2.5 text-[9px] font-bold text-slate-500 uppercase tracking-widest border-b border-[#253349]/50">Compliance Navigation</div>
              <NavItem id="ropa-hub" label="13 Statutory Forms (RoPA)" icon={<Icons.FileText />} activeTab={activeTab} setActiveTab={setActiveTab} />
              <NavItem id="clients" label="Enterprise Client Roster" icon={<Icons.Building />} activeTab={activeTab} setActiveTab={setActiveTab} badge={clients.length} />
              <NavItem id="notices" label="Multilingual Notices (Sec 5)" icon={<Icons.Layers />} activeTab={activeTab} setActiveTab={setActiveTab} />

              <div class="p-2.5 text-[9px] font-bold text-slate-500 uppercase tracking-widest border-b border-[#253349]/50 mt-1">Application Runtime</div>
              <NavItem id="consent" label="Consent Modal Simulator" icon={<Icons.CheckCircle />} activeTab={activeTab} setActiveTab={setActiveTab} />
              <NavItem id="privacy" label="User Privacy Center (Sec 6)" icon={<Icons.Users />} activeTab={activeTab} setActiveTab={setActiveTab} />
              <NavItem id="dsr" label="DSR & Grievances (SLA)" icon={<Icons.Clock />} activeTab={activeTab} setActiveTab={setActiveTab} />

              <div class="p-2.5 text-[9px] font-bold text-slate-500 uppercase tracking-widest border-b border-[#253349]/50 mt-1">Security & Breach</div>
              <NavItem id="crypto" label="Crypto Sandbox (Sec 8(5))" icon={<Icons.Lock />} activeTab={activeTab} setActiveTab={setActiveTab} />
              <NavItem id="breach" label="72-Hr Breach Triage (Sec 8)" icon={<Icons.AlertTriangle />} activeTab={activeTab} setActiveTab={setActiveTab} />

              <div class="p-2.5 text-[9px] font-bold text-slate-500 uppercase tracking-widest border-b border-[#253349]/50 mt-1">Architecture & SDK</div>
              <NavItem id="integration" label="Client Project Integration" icon={<Icons.Code />} activeTab={activeTab} setActiveTab={setActiveTab} />
            </aside>

            {/* TAB CONTENT DISPLAY */}
            <main class="flex-1 overflow-y-auto p-4 bg-[#0b0f19]">
              {activeTab === "ropa-hub" && <RopaHubTab tenantId={selectedTenant} client={currentClient} selectedForm={selectedForm} setSelectedForm={setSelectedForm} ropaData={ropaData} refreshRopa={() => fetchRopa(selectedTenant)} />}
              {activeTab === "clients" && <ClientsTab clients={clients} setSelectedTenant={setSelectedTenant} openNewModal={() => setShowNewClientModal(true)} />}
              {activeTab === "notices" && <NoticesTab tenantId={selectedTenant} client={currentClient} />}
              {activeTab === "consent" && <ConsentSimulatorTab tenantId={selectedTenant} client={currentClient} />}
              {activeTab === "privacy" && <PrivacyCenterTab tenantId={selectedTenant} client={currentClient} />}
              {activeTab === "dsr" && <DsrTab tenantId={selectedTenant} client={currentClient} />}
              {activeTab === "crypto" && <CryptoTab tenantId={selectedTenant} client={currentClient} />}
              {activeTab === "breach" && <BreachTab tenantId={selectedTenant} client={currentClient} />}
              {activeTab === "integration" && <IntegrationPlaybookTab tenantId={selectedTenant} client={currentClient} />}
            </main>
          </div>

          {/* NEW CLIENT MODAL */}
          {showNewClientModal && (
            <NewClientModal 
              onClose={() => setShowNewClientModal(false)}
              onSuccess={(nc) => {
                setClients([...clients, nc]);
                setSelectedTenant(nc.tenant_id);
                setShowNewClientModal(false);
              }}
            />
          )}
        </div>
      );
    }

    function NavItem({ id, label, icon, activeTab, setActiveTab, badge }) {
      const active = activeTab === id;
      return (
        <button
          onClick={() => setActiveTab(id)}
          class={`flex items-center justify-between w-full px-3 py-2 text-left border-l-2 transition-colors ${
            active 
              ? 'bg-[#161f30] text-sky-400 border-sky-400 font-semibold' 
              : 'text-slate-300 hover:bg-[#161f30]/60 hover:text-white border-transparent'
          }`}
        >
          <div class="flex items-center space-x-2">
            <span class={active ? 'text-sky-400' : 'text-slate-400'}>{icon}</span>
            <span>{label}</span>
          </div>
          {badge !== undefined && (
            <span class="mono-font text-[9px] bg-[#0b0f19] px-1 py-0.2 border border-[#253349] text-slate-400">{badge}</span>
          )}
        </button>
      );
    }

    // ====================================================================
    // 1. THE COMPLETE 13 STATUTORY FORMS RoPA HUB (FORM 01 TO FORM 13)
    // ====================================================================
    function RopaHubTab({ tenantId, client, selectedForm, setSelectedForm, ropaData, refreshRopa }) {
      const forms = [
        { id: "01", title: "Departments & Processes", stat: "3 DEP / 3 PRO", stage: "Stage 1", desc: "Organisation, department, function & operational process inventory" },
        { id: "02", title: "Personal Data Inventory", stat: "4 Elements", stage: "Stage 2", desc: "PII catalog, sensitivity rating (Critical/High/Med/Low) & encryption format" },
        { id: "03", title: "Applications & Systems", stat: "3 Systems", stage: "Stage 3", desc: "Software, databases, APIs, web/mobile apps, spreadsheets & shadow IT" },
        { id: "04", title: "Storage & Locations", stat: "3 Locations", stage: "Stage 4", desc: "Digital servers/cloud S3 (STO ID) & physical locked record rooms (REC ID)" },
        { id: "05", title: "Collection Points", stat: "2 Points", stage: "Stage 5", desc: "Web, mobile, API, and offline physical intake desks with notice verification" },
        { id: "06", title: "Principal Categories", stat: "3 Categories", stage: "Stage 6", desc: "Employees, customers, vendors, and special duty for Minors < 18 (Sec 9)" },
        { id: "07", title: "Purpose & Lawful Basis", stat: "3 Purposes", stage: "Stage 7", desc: "Explicit consent (Sec 6) vs Legitimate uses under Section 7 & retention" },
        { id: "08", title: "Retention & Disposal", stat: "2 Rules", stage: "Stage 8", desc: "Nightly cron retention rules, legal holds & cryptographic shredding logs" },
        { id: "09", title: "Roles & Access Matrix", stat: "2 Roles", stage: "Stage 9", desc: "RBAC least-privilege matrix and role-based dynamic masking controls" },
        { id: "10", title: "External Data Processors", stat: "2 Vendors", stage: "Stage 10", desc: "Third-party vendors (Razorpay, AWS), DPAs under Sec 8(2) & internal flows" },
        { id: "11", title: "Third-Party Data & Nominees", stat: "1 Nominee", stage: "Stage 11", desc: "Data supplied by someone else & legal nominee register under Section 14" },
        { id: "12", title: "Security Safeguards", stat: "2 Controls", stage: "Stage 12", desc: "Technical safeguards under Sec 8(5), ISO 27001 controls & breach triage" },
        { id: "13", title: "Notice & Consent Ledger", stat: "3 Notices", stage: "Stage 13", desc: "22 scheduled languages notice repository, SHA-256 consent receipts, DSR" }
      ];

      return (
        <div class="space-y-4 max-w-7xl">
          <div class="flex justify-between items-center bg-[#111827] p-3 border border-[#253349]">
            <div>
              <div class="flex items-center space-x-2">
                <span class="font-bold text-slate-100 uppercase tracking-wider text-xs">Record of Processing Activities (RoPA) Registry</span>
                <span class="bg-sky-500/10 text-sky-400 border border-sky-500/30 px-1.5 py-0.5 text-[10px] font-mono">13 Statutory Forms</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-0.5">Statutory compliance registers required under the Digital Personal Data Protection Act 2023.</p>
            </div>
            <button onClick={refreshRopa} class="px-3 py-1 bg-[#161f30] hover:bg-[#253349] border border-[#253349] text-slate-200 text-xs font-semibold">
              Sync RoPA Snapshot
            </button>
          </div>

          {/* Form Tabs Grid */}
          <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-1.5">
            {forms.map(f => (
              <button
                key={f.id}
                onClick={() => setSelectedForm(f.id)}
                class={`p-2 text-left border transition-all ${
                  selectedForm === f.id
                    ? 'bg-[#161f30] border-sky-500 text-white font-bold'
                    : 'bg-[#111827] border-[#253349] text-slate-300 hover:border-slate-600'
                }`}
              >
                <div class="flex justify-between items-center">
                  <span class="mono-font text-[10px] text-sky-400 font-bold">FORM {f.id}</span>
                  <span class="text-[9px] text-slate-400">{f.stage}</span>
                </div>
                <div class="text-[11px] truncate font-semibold mt-1">{f.title}</div>
                <div class="text-[10px] text-slate-400 mono-font mt-0.5">{f.stat}</div>
              </button>
            ))}
          </div>

          {/* Form Detailed Workspace View */}
          <div class="bg-[#111827] border border-[#253349] p-4">
            {selectedForm === "01" && <Form01Detail tenantId={tenantId} />}
            {selectedForm === "02" && <Form02Detail tenantId={tenantId} />}
            {selectedForm === "03" && <Form03Detail tenantId={tenantId} />}
            {selectedForm === "04" && <Form04Detail tenantId={tenantId} />}
            {selectedForm === "05" && <Form05Detail tenantId={tenantId} />}
            {selectedForm === "06" && <Form06Detail tenantId={tenantId} />}
            {selectedForm === "07" && <Form07Detail tenantId={tenantId} />}
            {selectedForm === "08" && <Form08Detail tenantId={tenantId} />}
            {selectedForm === "09" && <Form09Detail tenantId={tenantId} />}
            {selectedForm === "10" && <Form10Detail tenantId={tenantId} />}
            {selectedForm === "11" && <Form11Detail tenantId={tenantId} />}
            {selectedForm === "12" && <Form12Detail tenantId={tenantId} />}
            {selectedForm === "13" && <Form13Detail tenantId={tenantId} />}
          </div>
        </div>
      );
    }

    // FORM 01 DETAIL (Organisation, Departments & Processes)
    function Form01Detail({ tenantId }) {
      const [depts, setDepts] = useState([]);
      const [procs, setProcs] = useState([]);
      const [newDept, setNewDept] = useState({ name: "", head: "", email: "" });

      const load = async () => {
        try {
          const r1 = await fetch(`${API_BASE}/dpdp/ropa/department?tenant_id=${tenantId}`);
          const j1 = await r1.json();
          if (j1.success) setDepts(j1.items);

          const r2 = await fetch(`${API_BASE}/dpdp/ropa/process?tenant_id=${tenantId}`);
          const j2 = await r2.json();
          if (j2.success) setProcs(j2.items);
        } catch (e) {}
      };

      useEffect(() => { load(); }, [tenantId]);

      const handleAddDept = async (e) => {
        e.preventDefault();
        const did = "DEP-" + (depts.length + 1).toString().padStart(2, '0');
        await fetch(`${API_BASE}/dpdp/ropa/department`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tenant_id: tenantId, department_id: did, department_name: newDept.name, headName: newDept.head, headEmail: newDept.email })
        });
        setNewDept({ name: "", head: "", email: "" });
        load();
      };

      return (
        <div class="space-y-4">
          <div class="flex justify-between items-center pb-2 border-b border-[#253349]">
            <div>
              <h3 class="text-sm font-bold text-white uppercase tracking-wider">Form 01: Organisation, Department, Function & Process Inventory</h3>
              <p class="text-[11px] text-slate-400">Statutory Stage 1 — Identify every operating department, function responsibility, and operational process.</p>
            </div>
          </div>

          {/* Add Dept Form */}
          <form onSubmit={handleAddDept} class="bg-[#161f30] p-3 border border-[#253349] grid grid-cols-1 md:grid-cols-4 gap-2 items-end">
            <div>
              <label class="text-[10px] font-semibold text-slate-400 uppercase">Department Name</label>

    // ====================================================================
    // 3. MULTILINGUAL NOTICES (SECTION 5) TAB
    // ====================================================================
    function NoticesTab({ tenantId, client }) {
      const [lang, setLang] = useState("hi");
      const [notice, setNotice] = useState(null);
      const [showAuthorForm, setShowAuthorForm] = useState(false);
      const [newTitle, setNewTitle] = useState("");
      const [newBody, setNewBody] = useState("");
      const [saveStatus, setSaveStatus] = useState("");

      const languages = [
        { code: "en", name: "English (Official)" },
        { code: "hi", name: "हिन्दी (Hindi)" },
        { code: "mr", name: "मराठी (Marathi)" },
        { code: "bn", name: "বাংলা (Bengali)" },
        { code: "ta", name: "தமிழ் (Tamil)" },
        { code: "te", name: "తెలుగు (Telugu)" },
        { code: "gu", name: "ગુજરાતી (Gujarati)" },
        { code: "kn", name: "ಕನ್ನಡ (Kannada)" },
        { code: "ml", name: "മലയാളം (Malayalam)" },
        { code: "pa", name: "ਪੰਜਾਬੀ (Punjabi)" },
        { code: "or", name: "ଓଡ଼ିଆ (Odia)" },
        { code: "ur", name: "اردو (Urdu)" }
      ];

      const load = async (l) => {
        try {
          const res = await fetch(`${API_BASE}/dpdp/notice/active?tenant_id=${tenantId}&lang=${l}`);
          const j = await res.json();
          if (j.success) {
            setNotice(j.data);
            setNewTitle(j.data.title || "");
            setNewBody(j.data.bodyMarkdown || "");
          } else {
            setNotice(null);
          }
        } catch (e) {}
      };

      useEffect(() => { load(lang); }, [tenantId, lang]);

      const handleSaveNotice = async (e) => {
        e.preventDefault();
        setSaveStatus("Saving...");
        try {
          await fetch(`${API_BASE}/dpdp/notice`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              tenantId,
              noticeId: "NOT-" + lang.toUpperCase(),
              versionTag: "v1.0",
              languageCode: lang,
              title: newTitle,
              bodyMarkdown: newBody,
              dpoName: client?.dpo_name,
              dpoEmail: client?.dpo_email,
              dpoPhone: client?.dpo_phone
            })
          });
          setSaveStatus("Saved Successfully!");
          load(lang);
          setTimeout(() => { setShowAuthorForm(false); setSaveStatus(""); }, 1200);
        } catch (err) {
          setSaveStatus("Error saving notice");
        }
      };

      return (
        <div class="space-y-4 max-w-5xl">
          <div class="flex justify-between items-center bg-[#111827] p-3 border border-[#253349]">
            <div>
              <h2 class="text-xs font-bold text-slate-100 uppercase tracking-wider">Multilingual Dynamic Privacy Notices (Section 5)</h2>
              <p class="text-[11px] text-slate-400 mt-0.5">Section 5 mandates itemized notices in English + 22 Scheduled Indian Languages.</p>
            </div>
            <div class="flex items-center space-x-2">
              <button 
                onClick={() => setShowAuthorForm(!showAuthorForm)} 
                class="px-2.5 py-1 bg-[#161f30] hover:bg-sky-500 hover:text-slate-950 text-sky-400 border border-sky-500/30 text-xs font-semibold"
              >
                {showAuthorForm ? "✕ Cancel Authoring" : "+ Author / Edit Language Notice"}
              </button>
              <select value={lang} onChange={e=>setLang(e.target.value)} class="bg-[#0b0f19] border border-[#253349] text-sky-400 px-2 py-1 text-xs font-semibold outline-none">
                {languages.map(l => <option key={l.code} value={l.code}>{l.name}</option>)}
              </select>
            </div>
          </div>

          {/* Author / Edit Form */}
          {showAuthorForm && (
            <form onSubmit={handleSaveNotice} class="bg-[#161f30] p-4 border border-sky-500/40 space-y-3">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-sky-400 uppercase tracking-wider">Authoring Notice for: {languages.find(l=>l.code===lang)?.name}</span>
                {saveStatus && <span class="text-emerald-400 font-bold mono-font text-xs">{saveStatus}</span>}
              </div>
              <div>
                <label class="text-[10px] font-semibold text-slate-400 uppercase">Notice Title ({lang.toUpperCase()})</label>
                <input value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="e.g. गोपनीयता सूचना (Privacy Notice)" class="w-full bg-[#0b0f19] border border-[#253349] px-2.5 py-1.5 text-slate-100 outline-none text-xs" required />
              </div>
              <div>
                <label class="text-[10px] font-semibold text-slate-400 uppercase">Notice Body (Plain Language / Markdown)</label>
                <textarea rows="4" value={newBody} onChange={e=>setNewBody(e.target.value)} placeholder="State clearly what personal data is collected, for what purpose, and how consent can be withdrawn..." class="w-full bg-[#0b0f19] border border-[#253349] px-2.5 py-1.5 text-slate-100 outline-none text-xs" required></textarea>
              </div>
              <div class="flex justify-end space-x-2">
                <button type="button" onClick={()=>setShowAuthorForm(false)} class="px-3 py-1 bg-[#111827] text-slate-300 border border-[#253349] text-xs">Cancel</button>
                <button type="submit" class="px-3 py-1 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs">Save & Publish Notice</button>
              </div>
            </form>
          )}

          <div class="bg-[#111827] border border-[#253349] p-4 space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-[#253349]">
              <h3 class="text-sm font-bold text-white">{notice ? notice.title : 'Notice in ' + lang.toUpperCase()}</h3>
              <span class="px-1.5 py-0.2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[9px] font-mono">PUBLISHED v1.0</span>
            </div>

            <div class="p-3 bg-[#0b0f19] border border-[#253349] text-slate-200 text-xs leading-relaxed whitespace-pre-wrap">
              {notice ? notice.bodyMarkdown : 'No notice text loaded. Click "+ Author / Edit Language Notice" above to configure.'}
            </div>

            <div class="flex justify-between items-center text-[11px] text-slate-400 pt-1">
              <span>Appointed DPO: <strong class="text-slate-200">{notice ? notice.dpoContact.name : client.dpo_name}</strong></span>
              <span>Email: <span class="mono-font text-sky-400">{notice ? notice.dpoContact.email : client.dpo_email}</span></span>
            </div>
          </div>
        </div>
      );
    }

    // ====================================================================
    // 5. DATA PRINCIPAL PRIVACY CENTER & REVOCATION (SECTION 6(4))
    // ====================================================================
    function PrivacyCenterTab({ tenantId, client }) {
      const [user, setUser] = useState("EMP_1001");
      const [status, setStatus] = useState(null);

      const check = async () => {
        try {
          const res = await fetch(`${API_BASE}/dpdp/consent/status/${user}?tenant_id=${tenantId}`);
          const j = await res.json();
          if (j.success) setStatus(j);
        } catch (e) {}
      };

      const handleRevoke = async (pid) => {
        const res = await fetch(`${API_BASE}/dpdp/consent/withdraw`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tenant_id: tenantId, principalId: user, purposeId: pid })
        });
        const j = await res.json();
        alert(j.message);
        check();
      };

      useEffect(() => { check(); }, [tenantId]);

      return (
        <div class="space-y-4 max-w-3xl mx-auto">
          <div class="bg-[#111827] p-3 border border-[#253349] flex items-center justify-between">

              <h2 class="text-xs font-bold text-white uppercase tracking-wider">User Self-Service Privacy Center (Section 6(4))</h2>
              <p class="text-[11px] text-slate-400">Right to withdraw consent with single click comparable to granting it.</p>
            </div>
            <div class="flex items-center space-x-2">
              <input value={user} onChange={e=>setUser(e.target.value)} class="bg-[#0b0f19] border border-[#253349] px-2 py-1 text-xs text-white mono-font w-32" />
              <button onClick={check} class="bg-sky-500 text-slate-950 font-bold px-3 py-1 text-xs">Lookup</button>
            </div>
          </div>

          {status && status.record && (
            <div class="bg-[#111827] border border-[#253349] p-4 space-y-3">
              <div class="flex justify-between items-center pb-2 border-b border-[#253349]">
                <div>
                  <h3 class="text-xs font-bold text-white">Active Permissions for {user}</h3>
                  <p class="text-[10px] text-slate-400">Notice Version: {status.record.noticeVersion} | Status: <strong class="text-emerald-400">{status.record.status}</strong></p>
                </div>
                <button onClick={() => handleRevoke(null)} class="px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold">
                  Withdraw All Consents
                </button>
              </div>

              <div class="space-y-2">
                {status.record.items.map(item => (
                  <div key={item.purposeId} class="p-2.5 bg-[#0b0f19] border border-[#253349] flex justify-between items-center text-xs">
                    <div>
                      <strong class="text-white">{item.purposeCode}</strong>
                      <p class="text-[10px] text-slate-400">{item.description}</p>
                    </div>
                    <button 
                      onClick={() => handleRevoke(item.purposeId)} 
                      class={`px-2 py-0.5 text-[10px] font-semibold border ${
                        item.isGranted 
                          ? 'bg-rose-500/10 text-rose-400 border-rose-500/30 hover:bg-rose-500/20' 
                          : 'bg-slate-800 text-slate-500 border-slate-700'
                      }`}
                    >
                      {item.isGranted ? 'Withdraw' : 'Withdrawn'}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

              <strong class="text-white">Cryptographic Payloads</strong>
              {out ? (
                <div class="mono-font text-[11px] space-y-1.5 text-sky-400 bg-[#0b0f19] p-2.5 border border-[#253349] break-all">
                  <div><strong>Encrypted Aadhaar:</strong><br/><span class="text-slate-300">{out.encryptedAtRest.aadhaarCiphertext}</span></div>
                  <div><strong>Blind Index (HMAC-SHA256):</strong><br/><span class="text-amber-400">{out.encryptedAtRest.phoneBlindIndex}</span></div>
                  <div><strong>Masked Output:</strong><br/><span class="text-emerald-400">{out.maskedForNonAdmins.aadhaar} | {out.maskedForNonAdmins.phone}</span></div>
                </div>
              ) : (
                <p class="text-slate-500 italic">Click Encrypt to inspect payload...</p>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ====================================================================
    // 8. 72-HOUR BREACH TRIAGE (SECTION 8(6))
    // ====================================================================
    function BreachTab({ tenantId }) {
      const [incidents, setIncidents] = useState([]);
      const load = async () => {
        try {
          const res = await fetch(`${API_BASE}/dpdp/breach/incidents?tenant_id=${tenantId}`);
          const j = await res.json();
          if (j.success) setIncidents(j.incidents);
        } catch (e) {}
      };
      useEffect(() => { load(); }, [tenantId]);

      return (
        <div class="space-y-4 max-w-5xl">
          <div class="bg-[#111827] p-3 border border-[#253349]">
            <h2 class="text-xs font-bold text-white uppercase tracking-wider">Security Safeguards & 72-Hour DPBI Incident Notification (Section 8(6))</h2>
            <p class="text-[11px] text-slate-400 mt-0.5">Mandatory reporting to the Data Protection Board of India (DPBI) within 72 hours under threat of ₹200 Crore statutory penalty.</p>
          </div>

          <div class="border border-[#253349]">
            <table class="w-full text-left text-xs">
              <thead class="bg-[#0b0f19] text-slate-400 uppercase text-[10px] font-semibold">
                <tr>
                  <th class="p-2.5 border-b border-[#253349]">Incident ID</th>
                  <th class="p-2.5 border-b border-[#253349]">Incident Title</th>
                  <th class="p-2.5 border-b border-[#253349]">Severity Level</th>
                  <th class="p-2.5 border-b border-[#253349]">72-Hour Statutory SLA Countdown</th>
                  <th class="p-2.5 border-b border-[#253349]">DPBI Report</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#253349]/50">
                <tr class="hover:bg-[#161f30]">
                  <td class="p-2.5 mono-font font-bold text-rose-400">BRC-4091</td>
                  <td class="p-2.5 font-bold text-white">API Token Anomaly & Unauthorized Elevation</td>
                  <td class="p-2.5"><span class="px-1.5 py-0.2 text-[9px] bg-rose-500/10 text-rose-400 font-bold border border-rose-500/30">CRITICAL</span></td>
                  <td class="p-2.5 mono-font text-amber-400">71 Hours 14 Minutes Remaining</td>
                  <td class="p-2.5"><span class="px-1.5 py-0.2 text-[9px] bg-sky-500/10 text-sky-400 border border-sky-500/30">Form DPBI-01 Formatted</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ====================================================================
    // 9. CLIENT INTEGRATION PLAYBOOK & SDK (FOR ONGOING & EXISTING PROJECTS)
    // ====================================================================
    function IntegrationPlaybookTab({ tenantId, client }) {
      const [lang, setLang] = useState("nodejs");

      return (
        <div class="space-y-4 max-w-5xl">
          <div class="bg-[#111827] p-3 border border-[#253349]">
            <h2 class="text-xs font-bold text-white uppercase tracking-wider">How to Integrate this DPDP Engine into Existing & Ongoing Projects</h2>
            <p class="text-[11px] text-slate-400 mt-0.5">Plug this microservice into any client web, mobile, SaaS, or ERP project in 3 steps without rewriting business logic.</p>
          </div>

          <div class="grid grid-cols-3 gap-2 text-xs">
            <div class="p-3 bg-[#111827] border border-[#253349]">
              <div class="mono-font text-sky-400 font-bold text-[10px]">STEP 1: DATABASE</div>
              <strong class="text-white mt-1 block">Add Blind Index Column</strong>
              <p class="text-[11px] text-slate-400 mt-0.5">ALTER TABLE users ADD COLUMN phone_blind_idx VARCHAR(64);</p>
            </div>
            <div class="p-3 bg-[#111827] border border-[#253349]">
              <div class="mono-font text-sky-400 font-bold text-[10px]">STEP 2: BACKEND</div>
              <strong class="text-white mt-1 block">Mount dpdpConsentGuard</strong>
              <p class="text-[11px] text-slate-400 mt-0.5">Wraps API routes to block unconsented access with HTTP 403.</p>
            </div>
            <div class="p-3 bg-[#111827] border border-[#253349]">
              <div class="mono-font text-sky-400 font-bold text-[10px]">STEP 3: FRONTEND</div>
              <strong class="text-white mt-1 block">Drop Consent Modal</strong>
              <p class="text-[11px] text-slate-400 mt-0.5">Shows unbundled checkboxes in 22 languages and issues receipts.</p>
            </div>
          </div>

          <div class="flex space-x-1 border-b border-[#253349] pb-1">
            {['nodejs', 'react', 'python', 'flutter'].map(l => (
              <button key={l} onClick={()=>setLang(l)} class={`px-3 py-1 text-xs font-semibold uppercase ${lang === l ? 'bg-sky-500 text-slate-950' : 'bg-[#111827] text-slate-400'}`}>
                {l}
              </button>
            ))}
          </div>

          <div class="bg-[#111827] border border-[#253349] p-3 text-xs mono-font">
            {lang === "nodejs" && (
              <pre class="text-sky-400 leading-relaxed overflow-x-auto">
{`// 1. Install SDK in client project:
npm install @company/dpdp-engine

// 2. Mount in existing Express / NestJS backend (3 lines of code!):
const { dpdpConsentGuard, dpdpMasking } = require("@company/dpdp-engine");

// Wrap any sensitive data route:
app.get(
  "/api/user/profile/:userId",
  dpdpConsentGuard({ tenantId: "${tenantId}", purposeCode: "CORE_SERVICE" }),
  async (req, res) => {
    const user = await getUser(req.params.userId);
    // Dynamic Masking for non-supervisory staff:
    if (!req.user.isAdmin) {
      user.aadhaar = dpdpMasking.maskAadhaar(user.aadhaar);
      user.mobile = dpdpMasking.maskMobile(user.mobile);
    }
    return res.json(user);
  }
);`}
              </pre>
            )}

            {lang === "react" && (
              <pre class="text-sky-400 leading-relaxed overflow-x-auto">
{`// Mount Unbundled Consent Modal into ongoing React/Next.js Web App:
import { DPDPConsentModal } from "@company/dpdp-react";

export function SignupPage() {
  return (
    <DPDPConsentModal
      tenantId="${tenantId}"
      apiKey="${client.api_key}"
      language="hi" // English + 22 Scheduled Indian Languages
      onConsentGranted={(receipt) => console.log("SHA-256 Receipt:", receipt.signatureHash)}
    />
  );
}`}
              </pre>
            )}

            {lang === "python" && (
              <pre class="text-sky-400 leading-relaxed overflow-x-auto">
{`# Python FastAPI / Django Middleware:
from dpdp_engine import DPDPGuard, DPDPMasker

@app.get("/api/user/profile")
@DPDPGuard(tenant_id="${tenantId}", purpose="CORE_SERVICE")
async def get_profile(user_id: str):
    user = await fetch_user(user_id)
    return DPDPMasker.mask_sensitive(user)`}
              </pre>
            )}

            {lang === "flutter" && (
              <pre class="text-sky-400 leading-relaxed overflow-x-auto">
{`// Flutter Mobile Client App:
DPDPConsentWidget(
  tenantId: "${tenantId}",
  onConsentRecorded: (receipt) => print("Consent Hash: \${receipt.signature}"),
);`}
              </pre>
            )}
          </div>
        </div>
      );
    }

    // ONBOARD CLIENT MODAL
    function NewClientModal({ onClose, onSuccess }) {
      const [name, setName] = useState("");
      const [entity, setEntity] = useState("");
      const [industry, setIndustry] = useState("Healthcare & Hospitals");
      const [dpo, setDpo] = useState("");
      const [email, setEmail] = useState("");

      const handleCreate = async (e) => {
        e.preventDefault();
        const res = await fetch(`${API_BASE}/dpdp/clients`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ clientName: name, entityName: entity, industry, dpoName: dpo, dpoEmail: email })
        });
        const j = await res.json();
        if (j.success) {
          alert(j.message);
          onSuccess(j.client);
        }
      };

      return (
        <div class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div class="bg-[#111827] border border-[#253349] p-4 max-w-md w-full space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-[#253349]">
              <strong class="text-xs uppercase font-bold text-white">Register New Enterprise Client</strong>
              <button onClick={onClose} class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <form onSubmit={handleCreate} class="space-y-2 text-xs">
              <div>
                <label class="text-[10px] text-slate-400 uppercase font-semibold">Client Brand Name</label>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Reliance Retail" class="w-full bg-[#0b0f19] border border-[#253349] px-2 py-1 text-white" required />
              </div>
              <div>
                <label class="text-[10px] text-slate-400 uppercase font-semibold">Registered Legal Entity</label>
                <input value={entity} onChange={e=>setEntity(e.target.value)} placeholder="e.g. Reliance Retail Ventures Ltd." class="w-full bg-[#0b0f19] border border-[#253349] px-2 py-1 text-white" required />
              </div>
              <div>
                <label class="text-[10px] text-slate-400 uppercase font-semibold">Industry Vertical</label>
                <select value={industry} onChange={e=>setIndustry(e.target.value)} class="w-full bg-[#0b0f19] border border-[#253349] px-2 py-1 text-white">
                  <option value="Healthcare & Hospitals">Healthcare & Hospitals</option>
                  <option value="Retail & E-Commerce">Retail & E-Commerce</option>
                  <option value="Banking & FinTech">Banking & FinTech</option>
                  <option value="EdTech & Education">EdTech & Education</option>
                  <option value="Enterprise SaaS">Enterprise SaaS</option>
                </select>
              </div>
              <div>
                <label class="text-[10px] text-slate-400 uppercase font-semibold">Appointed DPO Name</label>
                <input value={dpo} onChange={e=>setDpo(e.target.value)} placeholder="e.g. Adv. Rajesh Nair" class="w-full bg-[#0b0f19] border border-[#253349] px-2 py-1 text-white" />
              </div>
              <div>
                <label class="text-[10px] text-slate-400 uppercase font-semibold">DPO Email</label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="dpo@client.com" class="w-full bg-[#0b0f19] border border-[#253349] px-2 py-1 text-white" />
              </div>
              <div class="pt-2 flex justify-end space-x-2">
                <button type="button" onClick={onClose} class="px-3 py-1 bg-[#161f30] text-slate-300">Cancel</button>
                <button type="submit" class="px-3 py-1 bg-sky-500 font-bold text-slate-950">Initialize Client & RoPA</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
